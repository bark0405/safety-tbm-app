<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>클릭 5분 안전코치</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --ink: #111827;
      --muted: #5f6b7a;
      --line: rgba(17, 24, 39, 0.12);
      --blue: #007aff;
      --green: #1f9d55;
      --yellow: #b7791f;
      --red: #d92d20;
      --purple: #7c3aed;
      --teal: #0f766e;
      --shadow: 0 16px 42px rgba(15, 23, 42, 0.11);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(150deg, rgba(0, 122, 255, 0.13), transparent 420px),
        linear-gradient(25deg, rgba(15, 118, 110, 0.12), transparent 420px),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px 16px calc(24px + var(--safe-bottom));
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -16px -16px 14px;
      padding: 13px 16px;
      background: rgba(245, 246, 248, 0.82);
      border-bottom: 1px solid rgba(17, 24, 39, 0.06);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      background: linear-gradient(145deg, var(--blue), var(--teal));
      border-radius: 16px;
      box-shadow: 0 10px 22px rgba(0, 122, 255, 0.25);
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.05;
      font-weight: 850;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
    }

    .offline-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 13px;
      color: #0f5132;
      background: rgba(31, 157, 85, 0.14);
      border: 1px solid rgba(31, 157, 85, 0.22);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .offline-dot {
      width: 9px;
      height: 9px;
      background: var(--green);
      border-radius: 999px;
      box-shadow: 0 0 0 5px rgba(31, 157, 85, 0.13);
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 14px;
      margin-bottom: 14px;
    }

    .intro-card,
    .progress-card,
    .step-panel,
    .result-panel {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: var(--radius-xl);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
    }

    .intro-card {
      padding: 22px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 32px;
      padding: 0 11px;
      color: #0b5cab;
      background: rgba(0, 122, 255, 0.12);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 850;
    }

    .intro-card h2 {
      margin: 14px 0 8px;
      font-size: clamp(33px, 5.3vw, 58px);
      line-height: 1;
      font-weight: 880;
      letter-spacing: 0;
    }

    .intro-card p {
      max-width: 720px;
      margin: 0;
      color: #46515f;
      font-size: 18px;
      line-height: 1.45;
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 14px;
      padding: 12px 13px;
      color: #593a00;
      background: rgba(255, 179, 64, 0.16);
      border: 1px solid rgba(255, 179, 64, 0.34);
      border-radius: var(--radius-md);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 720;
    }

    .progress-card {
      display: grid;
      align-content: space-between;
      min-height: 214px;
      padding: 18px;
    }

    .risk-badge {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 82px;
      padding: 13px;
      color: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .risk-badge.low {
      background: linear-gradient(145deg, #1f9d55, #12815f);
    }

    .risk-badge.medium {
      background: linear-gradient(145deg, #ffb340, #c46a00);
    }

    .risk-badge.high {
      background: linear-gradient(145deg, #ff453a, #b42318);
    }

    .risk-icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      flex: 0 0 auto;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 15px;
      font-size: 22px;
      font-weight: 900;
    }

    .risk-badge span {
      display: block;
      font-size: 12px;
      font-weight: 850;
      opacity: 0.86;
    }

    .risk-badge strong {
      display: block;
      margin-top: 3px;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
    }

    .progress-title {
      margin: 12px 0 7px;
      color: #334155;
      font-size: 15px;
      font-weight: 850;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      background: rgba(17, 24, 39, 0.10);
      border-radius: 999px;
    }

    .progress-track i {
      display: block;
      height: 100%;
      background: var(--blue);
      border-radius: 999px;
      transition: width 0.18s ease;
    }

    .step-dots {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    .step-dot {
      min-height: 36px;
      border: 0;
      border-radius: 999px;
      color: #4b5563;
      background: rgba(17, 24, 39, 0.07);
      font-size: 14px;
      font-weight: 850;
    }

    .step-dot.active {
      color: #fff;
      background: var(--blue);
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 0.86fr);
      gap: 14px;
      align-items: start;
    }

    .step-panel {
      min-width: 0;
      overflow: hidden;
    }

    .step-head {
      padding: 20px 20px 12px;
      border-bottom: 1px solid rgba(17, 24, 39, 0.08);
    }

    .step-kicker {
      color: var(--blue);
      font-size: 15px;
      font-weight: 900;
    }

    .step-head h2 {
      margin: 6px 0 6px;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 880;
    }

    .step-head p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.4;
    }

    .step-body {
      padding: 16px 20px 20px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .tap-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 82px;
      padding: 15px;
      text-align: left;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
    }

    .tap-card:hover {
      transform: translateY(-1px);
      border-color: rgba(0, 122, 255, 0.42);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    .tap-card:focus-visible,
    .step-dot:focus-visible,
    .nav-button:focus-visible,
    .tab:focus-visible {
      outline: 4px solid rgba(0, 122, 255, 0.24);
      outline-offset: 2px;
    }

    .tap-card.selected {
      background: rgba(0, 122, 255, 0.10);
      border-color: var(--blue);
      box-shadow: 0 12px 28px rgba(0, 122, 255, 0.15);
    }

    .tap-card.danger.selected {
      background: rgba(217, 45, 32, 0.09);
      border-color: var(--red);
      box-shadow: 0 12px 28px rgba(217, 45, 32, 0.12);
    }

    .tap-card.stop.selected {
      background: rgba(183, 121, 31, 0.10);
      border-color: #c46a00;
      box-shadow: 0 12px 28px rgba(183, 121, 31, 0.12);
    }

    .tap-icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      background: linear-gradient(145deg, var(--blue), var(--teal));
      border-radius: 16px;
      font-size: 17px;
      font-weight: 900;
    }

    .tap-card.danger .tap-icon {
      background: linear-gradient(145deg, var(--red), var(--yellow));
    }

    .tap-card.stop .tap-icon {
      background: linear-gradient(145deg, var(--yellow), #c46a00);
    }

    .tap-text {
      min-width: 0;
    }

    .tap-text strong {
      display: block;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 860;
      overflow-wrap: anywhere;
    }

    .tap-text span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
    }

    .checkmark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      margin-left: auto;
      flex: 0 0 auto;
      color: #fff;
      background: rgba(17, 24, 39, 0.16);
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
    }

    .selected .checkmark {
      background: var(--blue);
    }

    .danger.selected .checkmark {
      background: var(--red);
    }

    .stop.selected .checkmark {
      background: #c46a00;
    }

    .optional-note {
      margin-top: 14px;
      padding: 14px;
      background: rgba(17, 24, 39, 0.04);
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: var(--radius-lg);
    }

    .optional-note label {
      display: block;
      margin-bottom: 8px;
      font-size: 17px;
      font-weight: 850;
    }

    textarea {
      width: 100%;
      min-height: 96px;
      padding: 14px;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--line);
      border-radius: var(--radius-md);
      resize: vertical;
      font-size: 17px;
      line-height: 1.45;
    }

    textarea:focus {
      border-color: var(--blue);
      outline: 4px solid rgba(0, 122, 255, 0.16);
    }

    .step-actions {
      display: flex;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      padding: 0 18px;
      border: 0;
      border-radius: var(--radius-lg);
      font-size: 18px;
      font-weight: 880;
      white-space: nowrap;
    }

    .nav-button.primary {
      flex: 1;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 12px 28px rgba(0, 122, 255, 0.25);
    }

    .nav-button.secondary {
      color: #1f2937;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(17, 24, 39, 0.12);
    }

    .result-panel {
      position: sticky;
      top: 86px;
      min-width: 0;
      overflow: hidden;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid rgba(17, 24, 39, 0.08);
    }

    .result-head h2 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
      font-weight: 880;
    }

    .compact-risk {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 12px;
      color: #fff;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }

    .compact-risk.low { background: var(--green); }
    .compact-risk.medium { background: #c46a00; }
    .compact-risk.high { background: var(--red); }

    .tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 10px 18px 0;
      border-bottom: 1px solid rgba(17, 24, 39, 0.08);
    }

    .tab {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 14px;
      color: #475569;
      background: transparent;
      border: 0;
      border-bottom: 4px solid transparent;
      font-size: 16px;
      font-weight: 850;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .result-body {
      padding: 18px;
      background: rgba(255, 255, 255, 0.56);
    }

    .result-tab {
      display: none;
    }

    .result-tab.active {
      display: block;
    }

    .summary-grid {
      display: grid;
      gap: 12px;
    }

    .summary-card,
    .detail-box {
      padding: 16px;
      background: #fff;
      border: 1px solid rgba(17, 24, 39, 0.10);
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset;
    }

    .summary-card h3,
    .detail-box h3 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 880;
    }

    .summary-card p,
    .detail-box p,
    .detail-box li {
      margin: 0;
      color: #344054;
      font-size: 17px;
      line-height: 1.48;
      font-weight: 650;
    }

    .detail-box + .detail-box {
      margin-top: 12px;
    }

    .detail-box ul,
    .detail-box ol {
      margin: 0;
      padding-left: 22px;
    }

    .detail-box li + li {
      margin-top: 8px;
    }

    .mail-text,
    .tbm-text {
      white-space: pre-wrap;
      color: #344054;
      font-size: 16px;
      line-height: 1.55;
      font-weight: 600;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      padding: 0 18px 18px;
      background: rgba(255, 255, 255, 0.56);
    }

    .footer-note {
      margin: 14px 4px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    @media (max-width: 1040px) {
      .intro,
      .main {
        grid-template-columns: 1fr;
      }

      .result-panel {
        position: static;
      }
    }

    @media (max-width: 720px) {
      .app {
        padding: 12px 12px calc(18px + var(--safe-bottom));
      }

      .top {
        margin: -12px -12px 12px;
        padding: 11px 12px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 14px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .brand p,
      .offline-pill {
        display: none;
      }

      .intro-card {
        padding: 18px;
      }

      .intro-card h2 {
        font-size: 36px;
      }

      .intro-card p {
        font-size: 17px;
      }

      .progress-card {
        min-height: 0;
        padding: 14px;
      }

      .step-head {
        padding: 18px 16px 12px;
      }

      .step-head h2 {
        font-size: 27px;
      }

      .step-body {
        padding: 14px 16px 16px;
      }

      .card-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .tap-card {
        min-height: 78px;
        padding: 14px;
      }

      .tap-text strong {
        font-size: 18px;
      }

      .tap-text span {
        font-size: 14px;
      }

      .step-actions,
      .result-actions {
        padding: 0 16px 16px;
        flex-direction: column;
      }

      .nav-button {
        width: 100%;
      }

      .result-head {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px;
      }

      .result-body {
        padding: 16px;
      }

      .summary-card p,
      .detail-box p,
      .detail-box li {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useMemo, useState } = React;
    const h = React.createElement;

    const NOTICE = "본 앱은 작업 전 위험성 인식과 TBM 보조용입니다. 최종 작업 허가와 안전 판단은 현장 SOP, 법규, 작업허가 승인권자 기준을 우선해야 합니다.";

    const icon = {
      shield: h("svg", { width: 24, height: 24, viewBox: "0 0 24 24", fill: "none", "aria-hidden": true },
        h("path", { d: "M12 3 5 6v5c0 4.8 3 8.7 7 10 4-1.3 7-5.2 7-10V6l-7-3Z", stroke: "currentColor", strokeWidth: 2, strokeLinejoin: "round" }),
        h("path", { d: "m8.5 12 2.2 2.2 4.8-5", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" })
      ),
      warn: h("svg", { width: 20, height: 20, viewBox: "0 0 24 24", fill: "none", "aria-hidden": true },
        h("path", { d: "M12 9v4m0 4h.01M10.3 4.3 2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" })
      ),
      copy: h("svg", { width: 20, height: 20, viewBox: "0 0 24 24", fill: "none", "aria-hidden": true },
        h("path", { d: "M8 8V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-3M5 8h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z", stroke: "currentColor", strokeWidth: 2, strokeLinejoin: "round" })
      ),
      download: h("svg", { width: 20, height: 20, viewBox: "0 0 24 24", fill: "none", "aria-hidden": true },
        h("path", { d: "M12 3v11m0 0 4-4m-4 4-4-4M5 21h14", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" })
      )
    };

    const works = [
      { id: "sampling", label: "샘플링", hint: "봄베, Tubing", weight: 16 },
      { id: "filter", label: "필터/스트레이너 Cleaning", hint: "잔압, 협착", weight: 17 },
      { id: "valve", label: "밸브 조작", hint: "오조작, 고착", weight: 12 },
      { id: "lineopen", label: "Line Open / Flange Open", hint: "분출, 개방", weight: 25 },
      { id: "hotwork", label: "화기작업", hint: "점화원", weight: 25 },
      { id: "confined", label: "밀폐공간", hint: "산소결핍", weight: 27 },
      { id: "steam", label: "Steam/Condensate Drain", hint: "화상", weight: 20 },
      { id: "pump", label: "Pump 주변 작업", hint: "회전체", weight: 16 },
      { id: "height", label: "고소작업", hint: "추락", weight: 22 },
      { id: "electric", label: "전기작업", hint: "감전", weight: 24 }
    ];

    const moments = [
      "손이 협착점에 들어간다",
      "잔압이 분출될 수 있다",
      "고온부 또는 Steam에 접촉할 수 있다",
      "Tubing 또는 Hose가 이탈할 수 있다",
      "유해물질이 누출될 수 있다",
      "N2로 산소결핍이 발생할 수 있다",
      "점화원에 의해 화재/폭발이 발생할 수 있다",
      "중량물이 떨어질 수 있다",
      "작업자가 추락할 수 있다",
      "설비가 예상치 않게 기동될 수 있다"
    ];

    const bodyParts = ["손가락/손", "얼굴/눈", "팔/상체", "호흡기", "전신", "동료"];
    const preChecks = ["압력 0 확인", "Drain 완료", "Vent 완료", "Purge 완료", "LOTO 확인", "Gas 측정", "체결상태 확인", "동료 교차확인", "작업허가 확인", "PPE 착용"];
    const stopSignals = ["냄새 발생", "누출 확인", "압력 잔류", "체결상태 불확실", "작업범위 변경", "예상과 다른 소리/진동", "Gas Alarm", "동료 위치 불명확", "보호구 미착용", "시야 확보 불량"];
    const peerQuestions = ["압력 0 확인 같이 했나요?", "손 끼임 지점 확인했나요?", "체결상태 같이 확인했나요?", "Gas 측정값 확인했나요?", "작업 멈춤 기준 같이 정했나요?"];
    const promises = ["나는 불확실하면 작업을 멈춘다.", "나는 손을 먼저 넣지 않는다.", "나는 압력 0을 확인하기 전 개방하지 않는다.", "나는 체결상태가 불확실하면 작업을 시작하지 않는다.", "나는 냄새나 누출이 있으면 즉시 보고한다."];

    const momentWeight = {
      "손이 협착점에 들어간다": 9,
      "잔압이 분출될 수 있다": 11,
      "고온부 또는 Steam에 접촉할 수 있다": 10,
      "Tubing 또는 Hose가 이탈할 수 있다": 10,
      "유해물질이 누출될 수 있다": 11,
      "N2로 산소결핍이 발생할 수 있다": 14,
      "점화원에 의해 화재/폭발이 발생할 수 있다": 14,
      "중량물이 떨어질 수 있다": 9,
      "작업자가 추락할 수 있다": 12,
      "설비가 예상치 않게 기동될 수 있다": 12
    };

    const advice = {
      sampling: {
        scene: "샘플 봄베 연결부와 Tubing이 얼굴 높이에서 이탈할 수 있습니다.",
        coach: ["봄베 연결 방향을 같이 확인했습니까?", "튜빙 해체 전 잔압 해소 방법은 무엇입니까?", "Purge 배출 방향은 안전합니까?"]
      },
      filter: {
        scene: "커버 첫 풀림과 Basket 인출 순간에 손 협착과 잔류액 분출이 생길 수 있습니다.",
        coach: ["커버 첫 풀림 때 몸 위치는 어디입니까?", "손가락이 들어갈 협착점은 어디입니까?", "Drain 막힘 시 중지 기준은 무엇입니까?"]
      },
      valve: {
        scene: "익숙한 밸브일수록 Tag 착각과 무리한 힘 사용이 발생할 수 있습니다.",
        coach: ["Tag를 3점 대조했습니까?", "고착 시 중지 기준은 무엇입니까?", "조작 후 확인할 운전 지표는 무엇입니까?"]
      },
      lineopen: {
        scene: "Line과 Flange 개방 순간 잔압과 잔류물이 작업자 방향으로 나올 수 있습니다.",
        coach: ["압력 0을 어떤 방법으로 확인했습니까?", "첫 개방 방향에 사람이 없습니까?", "격리와 Drain 상태를 대조했습니까?"]
      },
      hotwork: {
        scene: "작은 점화원도 잔류 Vapor와 만나면 화재/폭발 조건이 됩니다.",
        coach: ["Gas 측정 주기는 정했습니까?", "불티 비산 방향은 확인했습니까?", "화기감시자는 준비됐습니까?"]
      },
      confined: {
        scene: "밀폐공간은 산소결핍, 독성, 구조 지연이 동시에 발생할 수 있습니다.",
        coach: ["산소와 유해가스 수치를 확인했습니까?", "감시인은 위치를 유지합니까?", "구조 장비와 연락 기준은 준비됐습니까?"]
      },
      steam: {
        scene: "Steam과 고온 응축수는 짧은 접촉만으로도 화상을 만들 수 있습니다.",
        coach: ["Drain 배출 방향은 안전합니까?", "밸브를 천천히 열 계획입니까?", "젖은 장갑 교체 기준은 무엇입니까?"]
      },
      pump: {
        scene: "Pump 주변 회전체와 고온부는 짧은 수작업에서도 손 접촉 위험을 만듭니다.",
        coach: ["가동 중 손이 들어갈 틈은 어디입니까?", "Guard 해체 시 LOTO를 적용합니까?", "누유나 진동 이상 시 누구에게 보고합니까?"]
      },
      height: {
        scene: "발판과 난간 상태가 흔들리면 짧은 작업도 추락 사고로 이어질 수 있습니다.",
        coach: ["추락 방지 설비를 확인했습니까?", "공구 낙하 방지는 됐습니까?", "바람과 시야 저하 시 중지합니까?"]
      },
      electric: {
        scene: "전원 격리와 무전압 확인 없이 접촉하면 감전 또는 예상 기동이 발생할 수 있습니다.",
        coach: ["무전압 확인을 같이 했습니까?", "LOTO 지점을 대조했습니까?", "재투입 금지 알림은 완료됐습니까?"]
      }
    };

    const steps = [
      { title: "오늘 작업", help: "작업 하나를 선택하세요." },
      { title: "위험 순간", help: "내가 다칠 수 있는 순간을 고르세요." },
      { title: "영향 부위", help: "다칠 수 있는 부위와 사람을 고르세요." },
      { title: "확인과 중지", help: "작업 전 확인과 멈출 신호를 고르세요." },
      { title: "동료와 약속", help: "동료 질문과 나의 약속을 고르세요." }
    ];

    function join(items, fallback) {
      if (!items.length) return fallback;
      return items.slice(0, 3).join(" / ") + (items.length > 3 ? ` 외 ${items.length - 3}개` : "");
    }

    function getRisk(state) {
      const work = works.find((item) => item.id === state.workId) || works[0];
      const momentScore = state.moments.reduce((sum, item) => sum + (momentWeight[item] || 7), 0);
      const missingCritical = ["압력 0 확인", "LOTO 확인", "Gas 측정", "작업허가 확인", "PPE 착용"].filter((item) => !state.preChecks.includes(item)).length;
      const score = Math.max(18, Math.min(96, 18 + work.weight + momentScore + missingCritical * 4 - state.preChecks.length * 2));
      if (score >= 72) return { label: "High", className: "high", icon: "!", score, text: "즉시 확인" };
      if (score >= 45) return { label: "Medium", className: "medium", icon: "?", score, text: "주의 필요" };
      return { label: "Low", className: "low", icon: "✓", score, text: "기본 확인" };
    }

    function buildResult(state) {
      const work = works.find((item) => item.id === state.workId) || works[0];
      const guide = advice[work.id] || advice.filter;
      const risk = getRisk(state);
      const stopText = state.stops.length ? join(state.stops, "작업중지 신호 미선택") : "작업중지 신호를 선택하세요.";
      const jsaItems = [
        `작업: ${work.label}`,
        `위험 장면: ${guide.scene}`,
        `선택 위험: ${state.moments.join(" / ") || "미선택"}`,
        `영향 부위: ${state.bodyParts.join(" / ") || "미선택"}`,
        `작업 전 확인: ${state.preChecks.join(" / ") || "미선택"}`,
        `중지 기준: ${state.stops.join(" / ") || "미선택"}`,
        state.note ? `현장 메모: ${state.note}` : "현장 메모: 없음"
      ];
      const tbm = [
        "[TBM 1분 카드]",
        `작업: ${work.label}`,
        `Risk Level: ${risk.label} (${risk.text})`,
        `오늘 내가 다칠 수 있는 순간: ${join(state.moments, guide.scene)}`,
        `작업중지 신호: ${stopText}`,
        `동료 확인 질문: ${state.peer}`,
        `오늘의 안전 약속: ${state.promise}`,
        NOTICE
      ].join("\n");
      const mail = [
        `제목: [클릭 5분 안전코치] ${work.label} / Risk ${risk.label}`,
        "",
        "작업 전 5분 안전코치 결과를 공유드립니다.",
        "",
        `- Risk Level: ${risk.label} (${risk.text})`,
        `- 오늘 내가 다칠 수 있는 순간: ${join(state.moments, guide.scene)}`,
        `- 작업중지 신호: ${stopText}`,
        `- 동료 확인 질문: ${state.peer}`,
        `- 오늘의 안전 약속: ${state.promise}`,
        state.note ? `- 현장 메모: ${state.note}` : "",
        "",
        NOTICE
      ].filter(Boolean).join("\n");
      return { work, guide, risk, stopText, jsaItems, tbm, mail, coach: guide.coach };
    }

    function TapCard({ label, hint, selected, onClick, index, variant, single }) {
      return h("button", {
        type: "button",
        className: `tap-card ${variant || ""} ${selected ? "selected" : ""}`,
        onClick,
        "aria-pressed": selected
      },
        h("span", { className: "tap-icon" }, single ? "선택" : String(index + 1).padStart(2, "0")),
        h("span", { className: "tap-text" },
          h("strong", null, label),
          hint ? h("span", null, hint) : null
        ),
        h("span", { className: "checkmark", "aria-hidden": true }, selected ? "✓" : "")
      );
    }

    function Tab({ id, label, active, setTab }) {
      return h("button", { type: "button", className: `tab ${active ? "active" : ""}`, onClick: () => setTab(id) }, label);
    }

    function App() {
      const [step, setStep] = useState(0);
      const [tab, setTab] = useState("summary");
      const [copyLabel, setCopyLabel] = useState("결과 복사");
      const [state, setState] = useState({
        workId: "filter",
        moments: ["손이 협착점에 들어간다", "잔압이 분출될 수 있다"],
        bodyParts: ["손가락/손", "얼굴/눈"],
        preChecks: ["압력 0 확인", "Drain 완료", "LOTO 확인", "동료 교차확인", "작업허가 확인", "PPE 착용"],
        stops: ["압력 잔류", "체결상태 불확실"],
        peer: peerQuestions[4],
        promise: promises[0],
        note: ""
      });

      const result = useMemo(() => buildResult(state), [state]);
      const progress = ((step + 1) / 5) * 100;

      function update(key, value) {
        setState((prev) => ({ ...prev, [key]: value }));
      }

      function toggle(key, value) {
        setState((prev) => {
          const list = prev[key];
          return { ...prev, [key]: list.includes(value) ? list.filter((item) => item !== value) : [...list, value] };
        });
      }

      function setStepAndTop(nextStep) {
        setStep(Math.max(0, Math.min(4, nextStep)));
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function allText() {
        return [
          "클릭 5분 안전코치 결과",
          `Risk Level: ${result.risk.label} (${result.risk.text})`,
          "",
          "오늘 내가 다칠 수 있는 순간",
          join(state.moments, result.guide.scene),
          "",
          "작업중지 신호",
          result.stopText,
          "",
          "동료 확인 질문",
          state.peer,
          "",
          "오늘의 안전 약속",
          state.promise,
          "",
          "상세 JSA",
          ...result.jsaItems.map((item) => `- ${item}`),
          "",
          result.tbm,
          "",
          "리더 코칭 질문 3개",
          ...result.coach.map((item, index) => `Q${index + 1}. ${item}`),
          "",
          "공유 메일 초안",
          result.mail
        ].join("\n");
      }

      async function copyResult() {
        const text = allText();
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const box = document.createElement("textarea");
          box.value = text;
          document.body.appendChild(box);
          box.select();
          document.execCommand("copy");
          document.body.removeChild(box);
        }
        setCopyLabel("복사됨");
        setTimeout(() => setCopyLabel("결과 복사"), 1300);
      }

      function downloadResult() {
        const blob = new Blob([allText()], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `click-5min-safety-coach-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function renderStep() {
        if (step === 0) {
          return h("div", { className: "card-grid" },
            works.map((item, index) => h(TapCard, {
              key: item.id,
              label: item.label,
              hint: item.hint,
              index,
              selected: state.workId === item.id,
              single: true,
              onClick: () => update("workId", item.id)
            }))
          );
        }
        if (step === 1) {
          return h("div", { className: "card-grid" },
            moments.map((item, index) => h(TapCard, {
              key: item,
              label: item,
              index,
              variant: "danger",
              selected: state.moments.includes(item),
              onClick: () => toggle("moments", item)
            }))
          );
        }
        if (step === 2) {
          return h("div", { className: "card-grid" },
            bodyParts.map((item, index) => h(TapCard, {
              key: item,
              label: item,
              index,
              selected: state.bodyParts.includes(item),
              onClick: () => toggle("bodyParts", item)
            }))
          );
        }
        if (step === 3) {
          return h("div", null,
            h("div", { className: "card-grid" },
              preChecks.map((item, index) => h(TapCard, {
                key: item,
                label: item,
                index,
                selected: state.preChecks.includes(item),
                onClick: () => toggle("preChecks", item)
              }))
            ),
            h("div", { className: "step-head", style: { paddingLeft: 0, paddingRight: 0, borderBottom: 0, marginTop: 8 } },
              h("span", { className: "step-kicker" }, "작업중지 신호"),
              h("p", null, "하나라도 보이면 멈출 신호입니다.")
            ),
            h("div", { className: "card-grid" },
              stopSignals.map((item, index) => h(TapCard, {
                key: item,
                label: item,
                index,
                variant: "stop",
                selected: state.stops.includes(item),
                onClick: () => toggle("stops", item)
              }))
            )
          );
        }
        return h("div", null,
          h("div", { className: "card-grid" },
            peerQuestions.map((item, index) => h(TapCard, {
              key: item,
              label: item,
              index,
              single: true,
              selected: state.peer === item,
              onClick: () => update("peer", item)
            }))
          ),
          h("div", { className: "step-head", style: { paddingLeft: 0, paddingRight: 0, borderBottom: 0, marginTop: 8 } },
            h("span", { className: "step-kicker" }, "오늘의 안전 약속"),
            h("p", null, "오늘 내가 지킬 문장입니다.")
          ),
          h("div", { className: "card-grid" },
            promises.map((item, index) => h(TapCard, {
              key: item,
              label: item,
              index,
              single: true,
              selected: state.promise === item,
              onClick: () => update("promise", item)
            }))
          ),
          h("div", { className: "optional-note" },
            h("label", { htmlFor: "note" }, "선택 입력: 현장 메모"),
            h("textarea", {
              id: "note",
              value: state.note,
              placeholder: "예: Drain 방향에 통행로 있음",
              onChange: (event) => update("note", event.target.value)
            })
          )
        );
      }

      return h("div", { className: "app" },
        h("header", { className: "top" },
          h("div", { className: "brand" },
            h("div", { className: "brand-mark" }, icon.shield),
            h("div", null,
              h("h1", null, "클릭 5분 안전코치"),
              h("p", null, "모바일 현장용 Step 1~5")
            )
          ),
          h("div", { className: "offline-pill" }, h("span", { className: "offline-dot" }), "외부 API 없음")
        ),

        h("section", { className: "intro" },
          h("div", { className: "intro-card" },
            h("span", { className: "eyebrow" }, "5분 클릭 TBM"),
            h("h2", null, "오늘 내가 다칠 수 있는 순간을 먼저 본다."),
            h("p", null, "모든 필수 입력은 큰 카드 버튼입니다. 현장 작업자가 장갑을 낀 상태에서도 누르기 쉽게 만들었습니다."),
            h("div", { className: "notice" }, icon.warn, h("span", null, NOTICE))
          ),
          h("aside", { className: "progress-card", "aria-label": "진행률과 위험도" },
            h("div", { className: `risk-badge ${result.risk.className}` },
              h("div", { className: "risk-icon", "aria-hidden": true }, result.risk.icon),
              h("div", null,
                h("span", null, "Risk Level"),
                h("strong", null, result.risk.label),
                h("span", null, result.risk.text)
              )
            ),
            h("div", null,
              h("div", { className: "progress-title" }, `Step ${step + 1} / 5 - ${steps[step].title}`),
              h("div", { className: "progress-track", "aria-hidden": true }, h("i", { style: { width: `${progress}%` } })),
              h("div", { className: "step-dots" },
                steps.map((item, index) => h("button", {
                  key: item.title,
                  type: "button",
                  className: `step-dot ${index === step ? "active" : ""}`,
                  onClick: () => setStepAndTop(index),
                  "aria-label": `Step ${index + 1} ${item.title}`
                }, index + 1))
              )
            )
          )
        ),

        h("main", { className: "main" },
          h("section", { className: "step-panel" },
            h("div", { className: "step-head" },
              h("span", { className: "step-kicker" }, `Step ${step + 1}`),
              h("h2", null, steps[step].title),
              h("p", null, steps[step].help)
            ),
            h("div", { className: "step-body" }, renderStep()),
            h("div", { className: "step-actions" },
              h("button", { type: "button", className: "nav-button secondary", onClick: () => setStepAndTop(step - 1), disabled: step === 0 }, "이전"),
              h("button", { type: "button", className: "nav-button primary", onClick: () => step < 4 ? setStepAndTop(step + 1) : document.getElementById("result").scrollIntoView({ behavior: "smooth" }) }, step < 4 ? "다음" : "결과 보기")
            )
          ),

          h("section", { className: "result-panel", id: "result" },
            h("div", { className: "result-head" },
              h("h2", null, "결과 요약"),
              h("div", { className: `compact-risk ${result.risk.className}` }, h("span", { "aria-hidden": true }, result.risk.icon), result.risk.label)
            ),
            h("nav", { className: "tabs", "aria-label": "결과 상세 탭" },
              h(Tab, { id: "summary", label: "요약", active: tab === "summary", setTab }),

              h(Tab, { id: "tbm", label: "TBM 카드", active: tab === "tbm", setTab }),
              h(Tab, { id: "coach", label: "리더 코칭", active: tab === "coach", setTab }),
              h(Tab, { id: "mail", label: "공유 메일", active: tab === "mail", setTab })
            ),
            h("div", { className: "result-body" },
              h("div", { className: `result-tab ${tab === "summary" ? "active" : ""}` },
                h("div", { className: "summary-grid" },
                  h("article", { className: "summary-card" }, h("h3", null, "오늘 내가 다칠 수 있는 순간"), h("p", null, join(state.moments, result.guide.scene))),
                  h("article", { className: "summary-card" }, h("h3", null, "작업중지 신호"), h("p", null, result.stopText)),
                  h("article", { className: "summary-card" }, h("h3", null, "동료 확인 질문"), h("p", null, state.peer)),
                  h("article", { className: "summary-card" }, h("h3", null, "오늘의 안전 약속"), h("p", null, state.promise))
                )
              ),
              h("div", { className: `result-tab ${tab === "jsa" ? "active" : ""}` },
                h("div", { className: "detail-box" },
                  h("h3", null, "상세 JSA"),
                  h("ul", null, result.jsaItems.map((item) => h("li", { key: item }, item)))
                )
              ),
              h("div", { className: `result-tab ${tab === "tbm" ? "active" : ""}` },
                h("div", { className: "detail-box" }, h("h3", null, "TBM 1분 카드"), h("div", { className: "tbm-text" }, result.tbm))
              ),
              h("div", { className: `result-tab ${tab === "coach" ? "active" : ""}` },
                h("div", { className: "detail-box" },
                  h("h3", null, "리더 코칭 질문 3개"),
                  h("ol", null, result.coach.map((item) => h("li", { key: item }, item)))
                )
              ),
              h("div", { className: `result-tab ${tab === "mail" ? "active" : ""}` },
                h("div", { className: "detail-box" }, h("h3", null, "공유 메일 초안"), h("div", { className: "mail-text" }, result.mail))
              )
            ),
            h("div", { className: "result-actions" },
              h("button", { type: "button", className: "nav-button primary", onClick: copyResult }, icon.copy, copyLabel),
              h("button", { type: "button", className: "nav-button secondary", onClick: downloadResult }, icon.download, "다운로드")
            )
          )
        ),

        h("p", { className: "footer-note" }, "필수 입력은 모두 클릭형입니다. 선택 메모는 결과 보완용이며 입력하지 않아도 앱은 동작합니다.")
      );
    }

    if (window.React && window.ReactDOM) {
      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    } else {
      document.getElementById("root").innerHTML = "<main style='padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans KR,sans-serif'><h1>React를 불러오지 못했습니다.</h1><p>네트워크가 제한된 환경이면 번들 파일로 배포해 주세요.</p></main>";
    }
  </script>
